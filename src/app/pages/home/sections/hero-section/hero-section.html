<!-- The poster is the LCP image: fetched first thanks to fetchpriority, at
     the smallest width that fills the screen. -->
<section class="hero" id="inicio">
    <img class="hero__poster"
         src="/media/hero-poster.webp"
         [attr.srcset]="posterSrcset"
         sizes="100vw"
         width="1920"
         height="1080"
         alt="Globos de Magic Balloons sobre el valle de Teotihuacán al amanecer"
         i18n-alt="@@hero.posterAlt"
         fetchpriority="high">

    <!-- Decorative, so it stays out of the prerendered HTML; fades in over the
         poster once it is actually playing. [muted] as well as the attribute:
         Angular's attribute alone doesn't set the property, and browsers only
         autoplay a video that is muted. -->
    @if (videoSrc())
    {
        <video class="hero__video"
               [class.hero__video--playing]="videoPlaying()"
               [src]="videoSrc()"
               (playing)="videoPlaying.set(true)"
               muted
               [muted]="true"
               autoplay
               loop
               playsinline
               disablepictureinpicture
               aria-hidden="true"></video>
    }

    <div class="hero__scrim"></div>

    <div class="hero__content">
        <p class="eyebrow hero__eyebrow" i18n="@@hero.eyebrow">Teotihuacán, México</p>

        <div class="hero__wrap">
            <!-- Same layering as the title: the clip hides, the img slides. -->
            <span class="hero__logo">
                <span class="logo__clip">
                    <img class="logo__img" src="/icons/magicballoons-logo.svg" alt="Magic Balloons" height="160" width="160">
                </span>
            </span>

            <!-- !!! Don't merge the spans!!! 
             I know it looks redundant, but it's necessary for the
             hero to animate the text spans separately rather than
             all of it at once. &ngsp so the crawlers don't read
             "la magiade volar" on accident. -->
            <h1 class="hero__title">
                <span class="title__line">
                    <span class="title__text" i18n="@@hero.titleFirst">La magia</span>
                </span>
                &ngsp;
                <span class="title__line">
                    <span class="title__text" i18n="@@hero.titleSecond">de volar</span>
                </span>
            </h1>
        </div>

        <div class="hero__buttons">
            <a class="button" [href]="contact.booking" i18n="@@hero.book">Reservar vuelo</a>
            <a class="button button--outline" href="#vuelos" i18n="@@hero.seePackages">Ver paquetes</a>
        </div>

        <ul class="hero__proof">
            <li class="proof__item">
                <a class="proof__link" [href]="contact.reviews" target="_blank" rel="noopener">
                    <span class="proof__bubbles" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span>
                    </span>
                    <span i18n="@@hero.proofRating"><strong>{{ contact.rating.score }}</strong> en TripAdvisor</span>
                    <span class="proof__muted" i18n="@@hero.proofReviews">· {{ contact.rating.count }} opiniones</span>
                </a>
            </li>
            <li class="proof__item" i18n="@@hero.proofAfac">Certificados por la <strong>AFAC</strong></li>
            <li class="proof__item" i18n="@@hero.proofPassengers"><strong>+10,000</strong> pasajeros</li>
        </ul>
    </div>
</section>
