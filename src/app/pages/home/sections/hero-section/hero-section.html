<!-- The poster is the LCP element and is preloaded in index.html. -->
<section class="hero" id="inicio">
    <img class="hero__poster"
         src="/media/hero-poster.webp"
         alt="Globos de Magic Balloons sobre el valle de Teotihuacán al amanecer"
         fetchpriority="high">

    <div class="hero__scrim"></div>

    <div class="hero__content">
        <p class="eyebrow hero__eyebrow">Teotihuacán, México</p>

        <div class="hero__wrap">
            <!-- Same layering as the title: the clip hides, the img slides. -->
            <span class="hero__logo">
                <span class="logo__clip">
                    <img class="logo__img" src="/icons/magicballoons-logo.svg" alt="Magic Balloons" height="160" width="160">
                </span>
            </span>

            <!-- !!! Don't merge the spans!!! 
             I know it looks redundant, but it's necessary for the
             hero to animate the text spans separately rather than
             all of it at once. &ngsp so the crawlers don't read
             "la magiade volar" on accident. -->
            <h1 class="hero__title">
                <span class="title__line">
                    <span class="title__text">La magia</span>
                </span>
                &ngsp;
                <span class="title__line">
                    <span class="title__text">de volar</span>
                </span>
            </h1>
        </div>

        <div class="hero__buttons">
            <a class="button" [href]="contact.booking">Reservar vuelo</a>
            <a class="button button--outline" href="#vuelos">Ver paquetes</a>
        </div>

        <ul class="hero__proof">
            <li class="proof__item">
                <a class="proof__link" [href]="contact.reviews" target="_blank" rel="noopener">
                    <span class="proof__bubbles" aria-hidden="true">
                        <span></span><span></span><span></span><span></span><span></span>
                    </span>
                    <strong>{{ contact.rating.score }}</strong> en TripAdvisor
                    <span class="proof__muted">· {{ contact.rating.count }} opiniones</span>
                </a>
            </li>
            <li class="proof__item">Certificados por la <strong>AFAC</strong></li>
            <li class="proof__item"><strong>+10,000</strong> pasajeros</li>
        </ul>
    </div>
</section>
